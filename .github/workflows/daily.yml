name: 513330 日报

on:
  schedule:
    - cron: '30 7 * * 1-5'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install akshare pandas numpy

      - name: 创建推送配置
        env:
          PUSH_CONFIG: ${{ secrets.PUSH_CONFIG }}
        run: echo "$PUSH_CONFIG" > push_config.txt

      - name: 爬取最新数据
        run: python crawler_513330.py

      - name: 运行分析
        id: analysis
        run: |
          python true_qt | tee /tmp/output.txt
          echo "first_line=$(head -1 /tmp/output.txt)" >> $GITHUB_OUTPUT

      - name: 推送通知
        run: |
          if [ -s /tmp/output.txt ]; then
            python push_notify.py --file /tmp/output.txt
          fi

      - name: 提交更新回仓库
        run: |
          git config user.name "bot"
          git config user.email "bot@513330"
          git add 513330_history_data.csv true_qt_state.json 结果/
          if git diff --quiet && git diff --staged --quiet; then
            echo "无变更, 跳过提交"
          else
            git commit -m "daily update $(TZ=Asia/Shanghai date '+%Y-%m-%d')"
            git push
            echo "已提交更新"
          fi
